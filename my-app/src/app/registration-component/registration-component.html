<div class="container mt-4" style="max-width: 500px; border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
    <h2 class="text-center mb-4">Đăng ký khóa học</h2>
    <form [formGroup]="courseForm" (ngSubmit)="onSubmit()">
        <!-- Tên: Bắt buộc (required) -->
        <div class="mb-3">
            <label class="form-label">Tên:</label>
            <input type="text" class="form-control" formControlName="fullName"
                [class.is-invalid]="fullName?.invalid && fullName?.touched"
                placeholder="Nhập tên">
            <div class="text-danger" *ngIf="fullName?.invalid && fullName?.touched">
                <small *ngIf="fullName?.hasError('required')">Bạn chưa nhập tên</small>
            </div>
        </div>

        <!-- Email: Bắt buộc + Định dạng email -->
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" class="form-control" formControlName="email"
                [class.is-invalid]="email?.invalid && email?.touched"
                placeholder="Nhập địa chỉ email">
            <div class="text-danger" *ngIf="email?.invalid && email?.touched">
                <small *ngIf="email?.hasError('required')">Bạn chưa nhập email</small>
                <small *ngIf="email?.hasError('email') && !email?.hasError('required')">Email không hợp lệ</small>
            </div>
        </div>

        <!-- Điện thoại: Bắt buộc + Chỉ cho phép nhập số -->
        <div class="mb-3">
            <label class="form-label">Điện thoại:</label>
            <input type="tel" class="form-control" formControlName="phone"
                [class.is-invalid]="phone?.invalid && phone?.touched"
                placeholder="Nhập số điện thoại">
            <div class="text-danger" *ngIf="phone?.invalid && phone?.touched">
                <small *ngIf="phone?.hasError('required')">Vui lòng nhập số điện thoại</small>
                <small *ngIf="phone?.hasError('pattern') && !phone?.hasError('required')">Số điện thoại không hợp lệ (chỉ nhập số)</small>
            </div>
        </div>

        <!-- Chọn khóa học: Bắt buộc chọn -->
        <div class="mb-3">
            <label class="form-label">Chọn khóa học:</label>
            <select class="form-select" formControlName="course"
                [class.is-invalid]="course?.invalid && course?.touched">
                <option value="">------------</option>
                <option value="angular">Angular căn bản</option>
                <option value="nodejs">Node.js nâng cao</option>
                <option value="datascience">Data Science</option>
            </select>
            <div class="text-danger" *ngIf="course?.invalid && course?.touched">
                <small>Vui lòng chọn một khóa học</small>
            </div>
        </div>

        <!-- Chọn ca học -->
        <div class="mb-3">
            <label class="form-label me-3">Chọn ca học:</label>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" formControlName="shift" id="sang" value="sang">
                <label class="form-check-label" for="sang">Sáng</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" formControlName="shift" id="toi" value="toi">
                <label class="form-check-label" for="toi">Tối</label>
            </div>
        </div>

        <!-- Đồng ý điều khoản: Phải tích chọn (requiredTrue) -->
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" formControlName="agree" id="checkTerms">
            <label class="form-check-label" for="checkTerms">Đồng ý với điều khoản</label>
            <div class="text-danger" *ngIf="agree?.invalid && agree?.touched">
                <small>Bạn phải đồng ý với điều khoản để tiếp tục</small>
            </div>
        </div>

        <!-- Nút Submit: Chỉ sáng lên khi TOÀN BỘ Form hợp lệ -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary" [disabled]="courseForm.invalid">Submit</button>
            <button type="button" class="btn btn-secondary" (click)="setDefaultValues()">Default values</button>
        </div>

        <!-- Khu vực hiển thị Debug trạng thái Form Model -->
        <hr>
        <div class="mt-3 p-2 bg-light border border-info rounded">
            <small class="text-primary"><b>Trạng thái Form Model hiện tại:</b></small>
            <pre class="mb-0" style="font-size: 11px;">{{ courseForm.value | json }}</pre>
        </div>
    </form>
</div>
