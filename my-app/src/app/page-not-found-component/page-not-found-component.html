<div class="not-found-wrapper">
  <!-- Hiệu ứng vầng sáng trang trí nền -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="not-found-card">
    <!-- Hình minh họa SVG sinh động -->
    <div class="illustration-container">
      <svg class="illustration-svg" viewBox="0 0 320 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Ngôi sao lấp lánh -->
        <circle cx="45" cy="40" r="2.5" fill="#a5b4fc" class="sparkle s1" />
        <circle cx="280" cy="55" r="2" fill="#c4b5fd" class="sparkle s2" />
        <circle cx="295" cy="140" r="3" fill="#fbcfe8" class="sparkle s3" />
        <circle cx="35" cy="160" r="2" fill="#bae6fd" class="sparkle s2" />
        <path d="M70 95 L72 101 L78 103 L72 105 L70 111 L68 105 L62 103 L68 101 Z" fill="#fde047" class="sparkle s1"
          opacity="0.85" />
        <path d="M255 105 L256.5 109.5 L261 111 L256.5 112.5 L255 117 L253.5 112.5 L249 111 L253.5 109.5 Z"
          fill="#93c5fd" class="sparkle s3" opacity="0.85" />

        <!-- Hành tinh nhỏ bay lơ lửng -->
        <g class="floating-planet">
          <circle cx="245" cy="55" r="24" fill="url(#planetGradient)" />
          <ellipse cx="245" cy="55" rx="34" ry="8" fill="none" stroke="#e0e7ff" stroke-width="2"
            transform="rotate(-20 245 55)" opacity="0.75" />
        </g>

        <!-- Phi hành gia / Robot lạc lối -->
        <g class="floating-astronaut">
          <!-- Bóng đổ bên dưới -->
          <ellipse cx="160" cy="195" rx="50" ry="8" fill="#1e293b" opacity="0.12" class="shadow-pulse" />

          <!-- Balo phản lực -->
          <rect x="122" y="78" width="76" height="64" rx="14" fill="#6366f1" />
          <rect x="126" y="82" width="68" height="56" rx="10" fill="#4f46e5" />

          <!-- Thân áo phi hành gia -->
          <rect x="130" y="85" width="60" height="60" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2.5" />

          <!-- Màn hình mặt nạ (kính bảo hộ) -->
          <rect x="137" y="93" width="46" height="32" rx="10" fill="#0f172a" />
          <!-- Đôi mắt tròn -->
          <circle cx="151" cy="107" r="3.5" fill="#38bdf8" />
          <circle cx="169" cy="107" r="3.5" fill="#38bdf8" />
          <!-- Biểu cảm ngơ ngác/buồn nhẹ -->
          <path d="M156 116 Q160 113 164 116" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none" />

          <!-- Đèn ăng-ten chớp đỏ -->
          <line x1="160" y1="85" x2="160" y2="68" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
          <circle cx="160" cy="65" r="5" fill="#ef4444" class="antenna-light" />

          <!-- Cánh tay vẫy chào -->
          <path d="M125 105 C110 112 108 126 118 133" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"
            fill="none" />
          <circle cx="118" cy="133" r="5.5" fill="#64748b" />

          <path d="M195 105 C210 108 214 122 204 133" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"
            fill="none" />
          <circle cx="204" cy="133" r="5.5" fill="#64748b" />

          <!-- Chân -->
          <rect x="137" y="145" width="18" height="20" rx="7" fill="#64748b" />
          <rect x="165" y="145" width="18" height="20" rx="7" fill="#64748b" />
        </g>

        <!-- Gradient định nghĩa -->
        <defs>
          <linearGradient id="planetGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- Số 404 lớn nghệ thuật -->
    <div class="code-container">
      <span class="code-digit">4</span>
      <span class="code-digit digit-middle">0</span>
      <span class="code-digit">4</span>
    </div>

    <!-- Nhãn thông báo -->
    <div class="error-badge">
      <span class="badge-dot"></span>
      ERROR 404 • KHÔNG TÌM THẤY TRANG
    </div>

    <!-- Tiêu đề chính & Lời nhắn -->
    <h1 class="error-title">Ối! Bạn đang đi lạc rồi</h1>
    <p class="error-desc">
      Đường dẫn bạn vừa truy cập không tồn tại, đã bị gỡ bỏ hoặc tạm thời không thể truy cập. Hãy để chúng tôi đưa bạn
      trở về nơi an toàn nhé!
    </p>

    <!-- Nhóm nút hành động chính -->
    <div class="actions-group">
      <a routerLink="/" class="btn btn-primary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>Về trang chủ</span>
      </a>

      <button type="button" (click)="goBack()" class="btn btn-secondary">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
        <span>Quay lại trang trước</span>
      </button>
    </div>

  </div>
</div>
